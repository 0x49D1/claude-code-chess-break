# Checks that hooks/release.ts matches plugin.json and CHANGELOG.md, then, on main, tags each
# CHANGELOG.md version that has no release (at the commit that set it in plugin.json) and
# publishes its release with the version's changelog lines.
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hooks/release.ts is up to date
        run: |
          python3 scripts/release_ts.py
          git diff --exit-code -- hooks/release.ts || {
            echo "::error::hooks/release.ts is stale: run python3 scripts/release_ts.py and commit it"
            exit 1
          }

  release:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release each changelog version that has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Oldest first, so that the newest ends up as the latest release.
          for version in $(sed -n 's/^## \([^ ]*\).*/\1/p' CHANGELOG.md | tac); do
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            commit=$(git log --format=%H -S"\"version\": \"$version\"" -- .claude-plugin/plugin.json | tail -n 1)
            if [ -z "$commit" ]; then
              echo "::warning::$tag: no commit sets this version in plugin.json"
              continue
            fi
            notes=$(awk -v v="$version" '$1 == "##" { on = ($2 == v); next } on' CHANGELOG.md | sed '/./,$!d')
            gh release create "$tag" --target "$commit" --title "$tag" --notes "$notes"
          done
